name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0
            platform-tools

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check project
        run: |
          set -eux

          test -d V2rayNG
          test -f V2rayNG/gradlew
          test -f V2rayNG/settings.gradle.kts
          test -d V2rayNG/app

          chmod +x V2rayNG/gradlew

      - name: Build HEV library
        run: |
          set -eux
          bash compile-hevtun.sh

      - name: Copy HEV library
        run: |
          set -eux
          cp -r libs V2rayNG/app/

      - name: Get Xray Core version
        working-directory: AndroidLibXrayLite
        run: |
          set -eux
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download Xray Core
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Prepare Gradle
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          set -eux
          ./gradlew clean
          ./gradlew assemblePlaystoreDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          set -eux

          mkdir -p output

          find V2rayNG/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find V2rayNG/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          cp "$APK" output/MyVPN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyVPN
          path: output/MyVPN.apk
          if-no-files-found: error
